name: QA

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  phpstan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer phpstan
      - run: composer phpcs
